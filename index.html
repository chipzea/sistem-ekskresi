paru:{n:'Paru-paru',e:'🫁',z:'Karbon dioksida (CO₂) dan uap air (H₂O)',t:['CO₂ hasil respirasi sel dibawa darah ke paru-paru.','Dikeluarkan lewat alveolus saat menghembuskan napas.','Uap air terlihat saat embusan napas di udara dingin.']},

const OD={
ginjal:{th:['#1f5fa8','#fff','#ffe44d'],st:['<b>Korteks</b> (bagian luar): tempat badan Malpighi (glomerulus + kapsul Bowman).','<b>Medula</b> (bagian dalam): berisi tubulus dan lengkung Henle.','<b>Pelvis renalis</b>: rongga yang menampung urine sebelum masuk ureter.','<b>Nefron</b>: satuan kerja ginjal, sekitar satu juta per ginjal.'],pr:'Darah masuk lewat arteri renalis → <b>filtrasi</b> di glomerulus → <b>reabsorpsi</b> di tubulus proksimal → <b>augmentasi</b> di tubulus distal → urine ke ureter → kandung kemih → uretra.',gg:['Nefritis','Albuminuria','Batu ginjal','Diabetes melitus','Diabetes insipidus'],fk:'Setiap hari ginjal menyaring sekitar 180 liter cairan dari darah, tetapi hanya sekitar 1,5 liter yang akhirnya keluar sebagai urine.'},
paru:{th:['#1f8a4c','#fff','#ffe44d'],st:['<b>Trakea</b> dan <b>bronkus</b>: saluran udara menuju paru-paru.','<b>Bronkiolus</b>: cabang saluran udara yang makin kecil.','<b>Alveolus</b>: gelembung kecil berdinding tipis, tempat pertukaran gas dengan kapiler darah.'],pr:'Respirasi sel menghasilkan CO₂ dan uap air → dibawa darah ke paru-paru → berdifusi ke alveolus → dikeluarkan saat <b>ekspirasi</b>.',gg:[],gx:'Peradangan atau kerusakan paru, misalnya pneumonia, bronkitis, dan asma, mengganggu pertukaran gas sehingga CO₂ sulit dikeluarkan. Merokok mempercepat kerusakan alveolus.',fk:'Paru-paru manusia memiliki ratusan juta alveolus, sehingga luas permukaan pertukaran gasnya mencapai puluhan meter persegi.'},
kulit:{th:['#e0662b','#fff','#ffe44d'],st:['<b>Epidermis</b>: lapisan terluar, memiliki pori-pori tempat keringat keluar.','<b>Dermis</b>: berisi kelenjar keringat, pembuluh darah, dan ujung saraf.','<b>Hipodermis</b>: lapisan lemak sebagai cadangan energi dan pelindung.'],pr:'Kelenjar keringat mengambil air, garam, dan sedikit urea dari darah → saluran kelenjar → keluar lewat pori-pori sebagai <b>keringat</b>. Pusat pengatur: hipotalamus.',gg:['Jerawat & biang keringat'],fk:'Selain membuang zat sisa, penguapan keringat menurunkan suhu tubuh, sehingga kita tidak kepanasan saat berolahraga.'},
hati:{th:['#6b3fa0','#fff','#ffe44d'],st:['<b>Lobus</b> kanan dan kiri: bagian utama hati.','<b>Kantung empedu</b>: menyimpan empedu sebelum dialirkan ke usus halus.','<b>Vena porta hepatika</b>: membawa darah kaya zat dari usus ke hati.'],pr:'Sel darah merah tua dipecah menjadi <b>bilirubin</b> → bagian dari empedu → kantung empedu → usus halus → keluar bersama feses. Amonia diubah menjadi <b>urea</b> → dibawa darah ke ginjal.',gg:['Sirosis hati'],gx:'Hepatitis (radang hati) dan penyakit kuning (ikterus) terjadi saat hati tidak mampu mengolah bilirubin sehingga kulit dan mata menguning.',fk:'Hati adalah kelenjar terbesar dalam tubuh (sekitar 1,5 kg pada orang dewasa) dan mampu memperbaiki jaringannya yang rusak.'}};
window.ZM=src=>{const d=document.createElement("div");d.className="zm";d.innerHTML='<img src="'+src+'" alt="Gambar diperbesar">';d.onclick=()=>d.remove();document.body.appendChild(d)};

gsel=null;board();document.querySelectorAll('#gboard .gcard').forEach(e=>e.classList.add('shf'));if(!q)gmsg('Pasangan benar! Semua kartu diacak otomatis satu kali.')}
function bad(a,b,t){[a,b].forEach(i=>{const e=cardEl(i);if(e){e.classList.remove('sel');e.classList.add('bad');setTimeout(()=>e.classList.remove('bad'),450)}});gmsg(t)}
function burst(k){const c=gc[k],el=cel(c.r,c.c),bd=g$('gboard'),x=el.offsetLeft+el.offsetWidth/2,y=el.offsetTop+el.offsetHeight/2,cols=['#ff6b00','#ffd400','#22a45d','#ec4899','#3b82f6','#8b5cf6'],R=innerWidth<600?55:85;
const ring=document.createElement('div');ring.className='fwr';ring.style.cssText='left:'+x+'px;top:'+y+'px';bd.appendChild(ring);setTimeout(()=>ring.remove(),800);
for(let j=0;j<24;j++){const p=document.createElement('i');p.className='fw';const an=Math.random()*6.283,d=R*(.45+Math.random()*.55);p.style.cssText='left:'+x+'px;top:'+y+'px;--fc:'+cols[j%6]+';--dx:'+(Math.cos(an)*d)+'px;--dy:'+(Math.sin(an)*d+18)+'px';bd.appendChild(p);setTimeout(()=>p.remove(),1000)}}
function click(e){
const b=e.target.closest('.gcard');if(!b||gbusy||g$('ovl').innerHTML)return;const i=+b.dataset.i;if(gc[i].gone)return;
if(gsel===null){gsel=i;b.classList.add('sel');return}
if(gsel===i){gsel=null;b.classList.remove('sel');return}
const a=gsel,A=gc[a],B=gc[i],t=akt;gsel=null;
if(A.id!=B.id){sk[t-1]-=50;AU.sfx(false);akt=t%n+1;am=false;bad(a,i,`Kelompok ${t} salah (−50). Kartu tidak diacak. Giliran Kelompok ${akt}.`);top();return}
const path=find(A,B);if(!path){bad(a,i,'Pasangan benar, tetapi garis penghubung terhalang kartu lain atau lebih dari 3 tikungan. Coba pasangan lain.');return}
gbusy=true;cardEl(a).classList.remove('sel');draw2(path);cardEl(a).classList.add('boom');cardEl(i).classList.add('boom');
const T=A.k=='t'?A:B;sk[t-1]+=100;AU.sfx(true);setTimeout(()=>{burst(a);burst(i)},380);
setTimeout(()=>{[a,i].forEach(k=>{const el=cardEl(k);if(el){el.classList.remove('boom');el.classList.add('gone')}gc[k].gone=true;GRID[gc[k].r][gc[k].c]=-1});
g$('gsvg').innerHTML='';gdone++;akt=t%n+1;am=false;top();
setTimeout(()=>{[a,i].forEach(k=>{const el=cardEl(k);if(el)el.remove()});gbusy=false;if(gdone<total)reshuf();
g$('ovl').innerHTML=`<div class="ovl"><div class="card fbx"><div class="fbi">✅</div><h2>Benar! Kelompok ${t} +100</h2><p><b>${T.ind} (${T.e})</b>: ${T.d}</p><div class="det" style="text-align:left"><b>Bahan diskusi: kenapa pasangannya begitu?</b><br>${T.p}</div><p><button class="btn" onclick="DDnext()">Lanjut</button></p></div></div>`},360)},650)}
window.DDnext=()=>{g$('ovl').innerHTML='';if(gdone>=total)return fin();if(!move())reshuf(true);gmsg('Giliran Kelompok '+akt+': klik dua kartu.')};
function fin(){const r=sk.map((v,i)=>[i+1,v]).sort((a,b)=>b[1]-a[1]);S.skor.dd=Math.max(S.skor.dd,r[0][1]);
app.innerHTML=head()+`<div class="fl fl-1"><h2 class="sec">Hasil Akhir</h2><div class="card">${r.map((x,i)=>`<div class="rank" style="--c:${W[(x[0]-1)%6]}"><b>${i===0?'🏆':i+1}</b><span class="dt"></span><span style="flex:1">Kelompok ${x[0]}</span><b class="nl2">${x[1]}</b></div>`).join('')}</div>
<p style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn" onclick="DDagain()">Main Lagi (kartu baru)</button><button class="btn alt" onclick="go('rekap')">Buka Rekap</button><button class="btn ghost" onclick="go('')">Kembali ke Menu</button></p></div>`}
setup()}

const TTS={"H": 14, "W": 16, "words": [{"w": "DIALYSIS", "r": 0, "c": 4, "d": "A", "l": "EN", "q": "Medical treatment that cleans the blood of patients whose kidneys have failed.", "n": 1, "k": "MOTS"}, {"w": "ALVEOLUS", "r": 2, "c": 2, "d": "A", "l": "ID", "q": "Struktur paru tempat CO₂ dari darah berdifusi keluar; kerusakannya menurunkan ekskresi gas sisa.", "n": 4, "k": "HOTS"}, {"w": "GLUKOSA", "r": 5, "c": 0, "d": "A", "l": "ID", "q": "Pada penderita diabetes melitus, zat ini muncul dalam urine karena jumlahnya melebihi kemampuan tubulus proksimal menyerapnya kembali.", "n": 8, "k": "HOTS"}, {"w": "DERMIS", "r": 7, "c": 1, "d": "A", "l": "ID", "q": "Lapisan kulit tempat kelenjar keringat berada.", "n": 10, "k": "MOTS"}, {"w": "KERINGAT", "r": 9, "c": 0, "d": "A", "l": "ID", "q": "Setelah berlari di cuaca panas, urine menjadi pekat karena sebagian air tubuh keluar sebagai cairan ini.", "n": 11, "k": "HOTS"}, {"w": "HATI", "r": 11, "c": 6, "d": "A", "l": "ID", "q": "Organ ekskresi yang menghasilkan empedu dan mengubah amonia menjadi urea.", "n": 14, "k": "MOTS"}, {"w": "NEPHRON", "r": 12, "c": 9, "d": "A", "l": "EN", "q": "The functional unit of the kidney where urine is formed.", "n": 15, "k": "MOTS"}, {"w": "FILTRATE", "r": 13, "c": 2, "d": "A", "l": "EN", "q": "The fluid in Bowman's capsule, before reabsorption takes place, is called the glomerular ____.", "n": 16, "k": "HOTS"}, {"w": "AMONIA", "r": 0, "c": 6, "d": "D", "l": "ID", "q": "Zat beracun hasil pemecahan protein yang diubah hati menjadi urea.", "n": 2, "k": "MOTS"}, {"w": "SKIN", "r": 0, "c": 11, "d": "D", "l": "EN", "q": "Organ that excretes sweat through its pores.", "n": 3, "k": "MOTS"}, {"w": "URETER", "r": 2, "c": 8, "d": "D", "l": "EN", "q": "Kidney stones often get stuck in this narrow tube, causing severe pain and urine backflow.", "n": 5, "k": "HOTS"}, {"w": "BLADDER", "r": 4, "c": 1, "d": "D", "l": "EN", "q": "Muscular sac that stores urine before it leaves the body.", "n": 6, "k": "MOTS"}, {"w": "HORMONE", "r": 4, "c": 4, "d": "D", "l": "EN", "q": "A deficiency of ADH, a chemical messenger of this type, causes very dilute urine because water reabsorption in the kidney drops.", "n": 7, "k": "HOTS"}, {"w": "ALBUMIN", "r": 6, "c": 15, "d": "D", "l": "ID", "q": "Jika urine berbusa dan mengandung protein ini, pori-pori saringan glomerulus kemungkinan rusak.", "n": 9, "k": "HOTS"}, {"w": "ADH", "r": 9, "c": 6, "d": "D", "l": "ID", "q": "Hormon yang mengatur penyerapan air di ginjal.", "n": 12, "k": "MOTS"}, {"w": "URINE", "r": 9, "c": 9, "d": "D", "l": "EN", "q": "If a person drinks very little water, this fluid becomes dark yellow and more concentrated.", "n": 13, "k": "HOTS"}]};
function pasangan(){
const {H,W,words}=TTS,N=words.length,cm={},V={},solved=new Set(),locked=new Set();
words.forEach((w,i)=>{for(let k=0;k<w.w.length;k++){const r=w.r+(w.d==='D'?k:0),c=w.c+(w.d==='A'?k:0),key=r+','+c;const o=cm[key]=cm[key]||{ch:w.w[k],ws:{},r,c};o.ws[w.d]=i;if(k==0)o.n=w.n}});
const keys=i=>{const w=words[i],a=[];for(let k=0;k<w.w.length;k++)a.push((w.r+(w.d==='D'?k:0))+','+(w.c+(w.d==='A'?k:0)));return a};
const g$=id=>document.getElementById(id),inp=key=>g$('c'+key.replace(',','_'));
const WC=['#22a45d','#e08e00','#8b5cf6','#ec4899','#14b8a6','#3b82f6'];
let n=(S.nk>=2?Math.min(S.nk,12):S.kel>=2?Math.min(S.kel,12):4),sk,akt=null,ex=new Set(),am=false,fm=false,dir='A',ac=words.findIndex(w=>w.d==='A');
const lg=w=>`<span class="lg ${w.l.toLowerCase()}">${w.l}</span><span class="lg ${w.k.toLowerCase()}">${w.k}</span>`;
const head=()=>banner('Teka-Teki Silang','50% HOTS &amp; 50% MOTS: 8 mendatar, 8 menurun (Indonesia &amp; English)',COR,'bn-c');
const msg=t=>g$('tmsg').textContent=t;
function setup(){app.innerHTML=head()+`<div class="fl fl-1"><div class="card"><h2>Siapkan kelompok</h2><p style="color:var(--muted);line-height:1.6">Kelompok berebut: pilih kelompok yang menjawab, isi kotak satu kata, lalu tekan <b>Kirim jawaban</b>. Benar <b>+100</b>, salah <b>−50</b>. Kelompok yang salah tidak boleh menjawab lagi sampai ada kata yang berhasil dijawab. Separuh soal berbahasa Inggris (label EN), dan separuh soal bertingkat HOTS (label ungu) serta MOTS (label hijau).</p><div class="field"><div><label>Jumlah kelompok</label><input id="nk" type="number" min="2" max="12" value="${n}" oninput="S.nk=Math.min(12,Math.max(2,+this.value||2))"></div><button class="btn" onclick="TTgo()">Mulai</button></div></div></div>`}
window.TTgo=()=>{n=Math.min(12,Math.max(2,+$('#nk').value||4));S.kel=n;S.nk=n;TTagain()};
window.TTagain=()=>{sk=Array(n).fill(0);solved.clear();locked.clear();Object.keys(V).forEach(k=>delete V[k]);akt=null;ex=new Set();am=false;fm=false;dir='A';ac=words.findIndex(w=>w.d==='A');start()};
function start(){
let g='';for(let r=0;r<H;r++)for(let c=0;c<W;c++){const k=r+','+c,o=cm[k];g+=o?`<div class="tc">${o.n?'<i>'+o.n+'</i>':''}<input id="c${r}_${c}" data-k="${k}" maxlength="2" autocomplete="off" autocapitalize="characters" spellcheck="false" aria-label="Kotak baris ${r+1} kolom ${c+1}"></div>`:'<div class="tc"></div>'}
const list=d=>words.map((w,i)=>[w,i]).filter(x=>x[0].d===d).sort((a,b)=>a[0].n-b[0].n).map(([w,i])=>`<button class="clq" data-i="${i}">${lg(w)}<b>${w.n}.</b> ${w.q} <span style="color:var(--muted)">(${w.w.length} ${w.l==='EN'?'letters':'huruf'})</span></button>`).join('');
app.innerHTML=head()+`<div class="fl fl-tt"><div class="fl-a"><div class="skorstrip" id="skor"></div><div class="prog" id="prog"></div><div class="tpet" id="tpet"></div><div class="timrow" id="timrow"></div>
<div class="card" id="tcur" style="margin-bottom:10px"></div></div>
<div class="fl-b"><div class="twrap"><div class="tg" style="grid-template-columns:repeat(${W},var(--cs))">${g}</div></div>
<div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center" id="tact"></div><b id="tmsg" style="display:block;margin-top:8px;min-height:22px;color:var(--muted)"></b></div>
<div class="fl-c"><div class="tcols" style="margin-top:14px"><div><h3 style="margin-bottom:8px">Mendatar ➡️ (Across)</h3>${list('A')}</div><div><h3 style="margin-bottom:8px">Menurun ⬇️ (Down)</h3>${list('D')}</div></div></div></div><div id="ovl"></div>`;
g$('skor').style.display='none';g$('prog').style.display='none';g$('timrow').className='tgrid';g$('tpet').classList.add('mini');bind();top();paint();msg('Pilih kelompok yang menjawab, lalu pilih soal dan isi kotaknya.')}
function top(){const s=g$('skor');s.style.setProperty('--n',n);
s.innerHTML='';
g$('prog').innerHTML=[...Array(N)].map((_,i)=>`<div class="pd ${i<solved.size?'sel':i===solved.size?'akt':'akn'}">${i+1}</div>`).join('');
g$('tpet').textContent=akt===null?'Pilih kelompok di bawah ini sebelum menjawab':'Kelompok '+akt+': isi kotak lalu kirim jawaban';
g$('timrow').innerHTML=sk.map((v,i)=>`<button class="tcell ${akt===i+1?'aktif':''} ${ex.has(i+1)?'exc':''}" style="--c:${WC[i%6]}" onclick="TTt(${i+1})"><span class="dt"></span><b class="tn">Kelompok ${i+1}</b><span class="ts">${v}</span></button>`).join('');
g$('tact').innerHTML=(akt!==null?`<button class="btn" onclick="TTsub()">✔ Kirim jawaban K${akt}</button><button class="akhiri ${am?'yakin':''}" style="position:static" onclick="TTend()">${am?'Ketuk lagi: akhiri giliran K'+akt:'Akhiri giliran K'+akt}</button>`:'')+`<button class="akhiri ${fm?'yakin':''}" style="position:static;margin-left:auto" onclick="TTstop()">${fm?'Ketuk lagi: selesaikan permainan':'Selesaikan permainan'}</button>`;
document.querySelectorAll('.tc input').forEach(e=>{e.readOnly=akt===null||locked.has(e.dataset.k)})}
function paint(){document.querySelectorAll('.tc').forEach(e=>e.classList.remove('hi'));keys(ac).forEach(k=>inp(k).parentElement.classList.add('hi'));
const w=words[ac];g$('tcur').innerHTML=`${lg(w)}<b>${w.n} ${w.d==='A'?'Mendatar (Across)':'Menurun (Down)'}</b>${solved.has(ac)?' ✅':''}<div style="margin-top:6px;line-height:1.5">${w.q}</div>`;
document.querySelectorAll('.clq').forEach(b=>{b.classList.toggle('on',+b.dataset.i===ac);b.classList.toggle('done',solved.has(+b.dataset.i))})}
function nudge(){['tpet','timrow'].forEach(id=>{const e=g$(id);e.classList.remove('attn');void e.offsetWidth;e.classList.add('attn')})}
function pick(key,toggle){const o=cm[key],both=o.ws.A!==undefined&&o.ws.D!==undefined;
if(toggle&&both)dir=dir==='A'?'D':'A';else if(o.ws[dir]===undefined)dir=dir==='A'?'D':'A';ac=o.ws[dir];paint()}
function bind(){
document.querySelectorAll('.tc input').forEach(e=>{const key=e.dataset.k;let pre=false;
e.addEventListener('pointerdown',()=>{pre=document.activeElement===e});
e.addEventListener('focus',()=>{pick(key,false);e.select()});
e.addEventListener('click',()=>{if(akt===null)nudge();if(pre)pick(key,true);pre=false;e.select()});
e.addEventListener('input',()=>{if(akt===null||locked.has(key)){e.value=V[key]||'';return}
const v=e.value.toUpperCase().replace(/[^A-Z]/g,'').slice(-1);e.value=v;V[key]=v;
if(v){const ks=keys(ac),i=ks.indexOf(key),nx=ks.slice(i+1).find(k=>!locked.has(k));if(i>=0&&nx)inp(nx).focus()}});
e.addEventListener('keydown',ev=>{const o=cm[key],mv={ArrowRight:[0,1],ArrowLeft:[0,-1],ArrowDown:[1,0],ArrowUp:[-1,0]}[ev.key];
if(mv){ev.preventDefault();const t=(o.r+mv[0])+','+(o.c+mv[1]);if(cm[t]){dir=mv[0]?'D':'A';inp(t).focus()}return}
if(ev.key==='Enter'&&akt!==null){TTsub();return}
if(ev.key==='Backspace'&&!e.value&&akt!==null){const ks=keys(ac),i=ks.indexOf(key);if(i>0&&!locked.has(ks[i-1])){ev.preventDefault();const p=inp(ks[i-1]);p.value='';V[ks[i-1]]='';p.focus()}}})});
document.querySelectorAll('.clq').forEach(b=>b.onclick=()=>{ac=+b.dataset.i;dir=words[ac].d;paint();if(akt!==null){const ks=keys(ac);inp(ks.find(k=>!V[k])||ks[0]).focus()}else nudge()})}
window.TTt=i=>{if(ex.has(i)||g$('ovl').innerHTML)return;akt=akt===i?null:i;am=false;top()};
window.TTend=()=>{if(!am){am=true;top();setTimeout(()=>{if(am){am=false;top()}},3500);return}
am=false;ex.add(akt);akt=null;if(ex.size>=n)ex.clear();top();msg('Giliran diakhiri tanpa pengurangan skor. Kelompok lain boleh merebut.')};
window.TTstop=()=>{if(!fm){fm=true;top();setTimeout(()=>{if(fm){fm=false;top()}},3500);return}fin()};
window.TTsub=()=>{if(akt===null||g$('ovl').innerHTML)return;const w=words[ac],ks=keys(ac),t=akt;
if(solved.has(ac)){msg('Kata ini sudah terjawab. Pilih soal lain.');return}
if(!ks.every(k=>V[k])){msg('Lengkapi semua kotak kata ini dulu, lalu kirim jawaban.');return}
if(ks.every((k,j)=>V[k]===w.w[j])){sk[t-1]+=100;AU.sfx(true);solved.add(ac);ks.forEach(k=>{locked.add(k);inp(k).parentElement.classList.add('ok')});akt=null;am=false;ex.clear();top();paint();
g$('ovl').innerHTML=`<div class="ovl"><div class="card fbx"><div class="fbi">✅</div><h2>Benar! Kelompok ${t} +100</h2><p>Jawaban: <b>${w.w}</b></p><div class="det" style="text-align:left"><b>Bahan diskusi: soal ${w.n} ${w.d==='A'?'mendatar':'menurun'}</b><br>${w.q}</div><p><button class="btn" onclick="TTnext()">Lanjut</button></p></div></div>`}
else{sk[t-1]-=50;AU.sfx(false);ex.add(t);akt=null;am=false;if(ex.size>=n)ex.clear();
ks.forEach(k=>{if(!locked.has(k)){V[k]='';inp(k).value='';const p=inp(k).parentElement;p.classList.add('bad');setTimeout(()=>p.classList.remove('bad'),600)}});
top();msg(`Kelompok ${t} salah (−50), jawabannya dihapus. Kelompok lain boleh merebut.`)}};
window.TTnext=()=>{g$('ovl').innerHTML='';if(solved.size>=N)return fin();msg('Pilih kelompok berikutnya yang akan menjawab.')};
function fin(){const r=sk.map((v,i)=>[i+1,v]).sort((a,b)=>b[1]-a[1]);S.skor.pas=Math.max(S.skor.pas,r[0][1]);
app.innerHTML=head()+`<div class="fl fl-1"><h2 class="sec">Hasil Akhir <small>${solved.size} dari ${N} kata terjawab</small></h2><div class="card">${r.map((x,i)=>`<div class="rank" style="--c:${WC[(x[0]-1)%6]}"><b>${i===0?'🏆':i+1}</b><span class="dt"></span><span style="flex:1">Kelompok ${x[0]}</span><b class="nl2">${x[1]}</b></div>`).join('')}</div>
<p style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn" onclick="TTagain()">Main Lagi</button><button class="btn alt" onclick="go('rekap')">Buka Rekap</button><button class="btn ghost" onclick="go('')">Kembali ke Menu</button></p></div>`}
setup()}

function rekap(){app.innerHTML=banner('Rekap Skor','Skor tertinggi sesi ini',PUR)+`<div class="stat"><div class="card"><div class="num">${S.skor.dd}</div><div class="l">Matching (skor kelompok tertinggi)</div></div><div class="card"><div class="num">${S.skor.pas}</div><div class="l">Teka-Teki Silang (skor kelompok tertinggi)</div></div><div class="card"><div class="num">${S.skor.dd+S.skor.pas}</div><div class="l">Total</div></div></div>`}
function tentang(){app.innerHTML=banner('Tentang','Media pembelajaran interaktif',PUR)+`<div class="card" style="line-height:1.7"><p><b>Sistem Ekskresi pada Manusia</b><br>Mata pelajaran IPA - SMP/MTs Kelas 8.</p><p>Tujuan pembelajaran: siswa dapat menyebutkan organ ekskresi beserta zat sisanya, menjelaskan proses pembentukan urine, dan mengidentifikasi gangguan sistem ekskresi.</p><p style="border-top:2px solid var(--border);padding-top:12px">Media ini dibuat oleh <b>Budi Sucipto, S.Si</b></p></div>`}
draw();
</script>
